<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>dynamic</title>
</head>
<body>
  <h1 id="title"></h1>
  <p id="description"></p>

  <form id="dynamic-form"></form>

  <h2 id="result-title"></h2>
  <div id="result"></div>

  <script>
    async function init() {
      // バックエンドから画面定義を取得
      const res = await fetch("/api/screen");
      const screen = await res.json();

      // タイトル・説明文
      document.getElementById("title").textContent = screen.title;
      document.getElementById("description").textContent = screen.description;

      const form = document.getElementById("dynamic-form");

      // 入力項目を動的生成
      screen.fields.forEach(field => {
        const label = document.createElement("label");
        label.textContent = field.label;

        const input = document.createElement("input");
        input.name = field.name;
        input.type = field.type;

        form.appendChild(label);
        form.appendChild(document.createElement("br"));
        form.appendChild(input);
        form.appendChild(document.createElement("br"));
      });

      // ボタン
      const button = document.createElement("button");
      button.type = "submit";
      button.textContent = screen.submitLabel;
      form.appendChild(button);

      // 結果タイトル（バックエンド定義）
      document.getElementById("result-title").textContent = screen.resultTitle;

      // 結果表示（画面遷移なし）
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        // バックエンドが定義した表示テンプレートを使う
        screen.resultTemplate.forEach(tpl => {
          const p = document.createElement("p");
          const value = formData.get(tpl.field);
          p.textContent = tpl.format.replace("{value}", value ?? "");
          resultDiv.appendChild(p);
        });
      });
    }

    init();
  </script>
</body>
</html>
